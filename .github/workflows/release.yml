name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android 36 platform
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Decode release keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Restore debug keystore
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gsm-auto-answer-debug-keystore-v1

      - name: Build debug APK
        if: env.HAS_SIGNING_KEY != 'true'
        run: ./gradlew assembleDebug

      - name: Prepare release files
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p release
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            SOURCE="app/build/outputs/apk/release/app-release.apk"
            ASSET="gsm-auto-answer-${VERSION}.apk"
          else
            SOURCE="app/build/outputs/apk/debug/app-debug.apk"
            ASSET="gsm-auto-answer-${VERSION}-debug.apk"
          fi
          cp "$SOURCE" "release/$ASSET"
          (cd release && sha256sum "$ASSET" > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsm-auto-answer-apk
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/gsm-auto-answer-*.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            GSM Auto-Answer is a local call attendant for SIM calls: it answers,
            plays your message, loops hold music, then opens a timed Unmute window.

            **Install**
            1. Download the APK below.
            2. Allow installation from the browser or file manager.
            3. Open the app and set it as the default phone app.

            **Before relying on caller audio**
            Caller-side audio depends on the phone firmware. Open **Device check**
            and complete the live call test from a second phone. If the caller
            cannot hear the test tone, auto-answer stays blocked. The app never
            falls back to the loudspeaker.

            Requires Android 10 or newer. No internet permission; settings and
            audio stay on the device. See the README and PRIVACY.md for details.

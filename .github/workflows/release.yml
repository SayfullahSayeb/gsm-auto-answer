name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android 36 platform
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare signing key
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_B64="${ANDROID_KEYSTORE_B64:-$RELEASE_KEYSTORE_B64}"
          STORE_PASS="${ANDROID_STORE_PASS:-$RELEASE_STORE_PASS}"
          ALIAS="${ANDROID_ALIAS:-$RELEASE_ALIAS}"
          KEY_PASS="${ANDROID_KEY_PASS:-$RELEASE_KEY_PASS}"

          # Tolerate values pasted together with their NAME= label.
          KEYSTORE_B64="${KEYSTORE_B64#ANDROID_KEYSTORE_BASE64=}"
          KEYSTORE_B64="${KEYSTORE_B64#RELEASE_KEYSTORE=}"
          STORE_PASS="${STORE_PASS#ANDROID_KEYSTORE_PASSWORD=}"
          STORE_PASS="${STORE_PASS#RELEASE_KEYSTORE_PASSWORD=}"
          ALIAS="${ALIAS#ANDROID_KEY_ALIAS=}"
          ALIAS="${ALIAS#RELEASE_KEY_ALIAS=}"
          KEY_PASS="${KEY_PASS#ANDROID_KEY_PASSWORD=}"
          KEY_PASS="${KEY_PASS#RELEASE_KEY_PASSWORD=}"

          KEYSTORE_B64=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          STORE_PASS=$(printf '%s' "$STORE_PASS")
          ALIAS=$(printf '%s' "$ALIAS" | tr -d '[:space:]')
          KEY_PASS=$(printf '%s' "$KEY_PASS")

          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release signing key configured; this run will use a debug build."
            exit 0
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASS" > "$RUNNER_TEMP/keystore-list.txt" 2> "$RUNNER_TEMP/keystore-error.txt"; then
            echo "::error::The release keystore could not be opened. Check ANDROID_KEYSTORE_PASSWORD and make sure ANDROID_KEYSTORE_BASE64 contains only the base64 keystore data."
            cat "$RUNNER_TEMP/keystore-error.txt"
            exit 1
          fi

          if [ -z "$ALIAS" ] || ! keytool -list -alias "$ALIAS" -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASS" > /dev/null 2>&1; then
            ALIAS=$(awk -F, '/PrivateKeyEntry/ {print $1; exit}' "$RUNNER_TEMP/keystore-list.txt" | tr -d '[:space:]')
            echo "Configured key alias was missing or wrong; using the alias found in the keystore."
          fi

          if ! keytool -certreq -alias "$ALIAS" -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PASS" -keypass "$KEY_PASS" > /dev/null 2> "$RUNNER_TEMP/key-error.txt"; then
            echo "::error::The key password does not match the keystore alias. Check ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS."
            cat "$RUNNER_TEMP/key-error.txt"
            exit 1
          fi

          {
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release signing key validated."

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew assembleRelease

      - name: Restore debug keystore
        if: steps.signing.outputs.signed != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gsm-auto-answer-debug-keystore-v1

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleDebug

      - name: Prepare release files
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p release
          if [ "$SIGNED" = "true" ]; then
            SOURCE="app/build/outputs/apk/release/app-release.apk"
            ASSET="gsm-auto-answer-${VERSION}.apk"
          else
            SOURCE="app/build/outputs/apk/debug/app-debug.apk"
            ASSET="gsm-auto-answer-${VERSION}-debug.apk"
          fi
          cp "$SOURCE" "release/$ASSET"
          (cd release && sha256sum "$ASSET" > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsm-auto-answer-apk
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/gsm-auto-answer-*.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            GSM Auto-Answer is a local call attendant for SIM calls: it answers,
            plays your message, loops hold music, then opens a timed Unmute window.

            **Install**
            1. Download the APK below.
            2. Allow installation from the browser or file manager.
            3. Open the app and set it as the default phone app.

            **Before relying on caller audio**
            Caller-side audio depends on the phone firmware. Open **Device check**
            and complete the live call test from a second phone. If the caller
            cannot hear the test tone, auto-answer stays blocked. The app never
            falls back to the loudspeaker.

            Requires Android 10 or newer. No internet permission; settings and
            audio stay on the device. See the README and PRIVACY.md for details.
